<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Account - Resonus</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/treatwashere/resonus/refs/heads/main/assets/Resonus.png">
  <style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0d0d12;
  color: #fff;
  min-height: 100vh;
}

.header {
  padding: 20px;
  background: linear-gradient(135deg, #1db954 0%, #1a6fd4 100%);
  display: flex;
  align-items: center;
  gap: 14px;
}

.back {
  background: rgba(255,255,255,.2);
  border: none;
  color: #fff;
  font-size: 1.2rem;
  padding: 8px 14px;
  border-radius: 20px;
  cursor: pointer;
}

.back:hover { background: rgba(255,255,255,.35); }

.header h1 { font-size: 1.4rem; }

.wrap { max-width: 520px; margin: 0 auto; padding: 24px 20px 60px; }

.card {
  background: #16161d;
  border: 1px solid #24242e;
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 18px;
}

.card h2 {
  font-size: 1rem;
  color: #1db954;
  margin-bottom: 14px;
  letter-spacing: .3px;
}

.avatar-row {
  display: flex;
  align-items: center;
  gap: 18px;
}

.avatar {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  object-fit: cover;
  background: #24242e;
  border: 3px solid #1db954;
  cursor: pointer;
  flex-shrink: 0;
}

.avatar-hint {
  font-size: .78rem;
  color: #777;
  margin-top: 6px;
}

.who { min-width: 0; }

.who-name {
  font-weight: 700;
  font-size: 1.15rem;
  color: #fff;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color 0.2s;
}

.who-name:hover {
  color: #1db954;
}

.who-name .edit-icon {
  font-size: 0.8rem;
  opacity: 0.6;
}

.who-email {
  font-size: .85rem;
  color: #aaa;
  margin-top: 3px;
  word-break: break-all;
}

.who-sub { font-size: .85rem; color: #888; margin-top: 3px; }

#fileIn { display: none; }

.link-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid #22222c;
}

.link-row:last-child { border-bottom: none; }

.link-icon {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.ic-github { background: #24292f; }
.ic-google { background: #fff; }
.ic-discord { background: #5865F2; }
.ic-email { background: #1db954; font-size: 1.1rem; }

.link-name { flex: 1; font-weight: 600; font-size: .95rem; }

.link-state { font-size: .78rem; color: #666; font-weight: 400; }

.link-btn {
  padding: 7px 16px;
  border: none;
  border-radius: 18px;
  font-size: .82rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}

.link-btn.on { background: #1e3d2b; color: #4ade80; }
.link-btn.off { background: #2b2b38; color: #fff; }
.link-btn.off:hover { background: #383848; }

.stat {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  font-size: .92rem;
}

.stat span:last-child { color: #1db954; font-weight: 700; }

.btn {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 9px;
  font-weight: 700;
  font-size: .98rem;
  cursor: pointer;
  margin-top: 8px;
}

.btn.grey { background: #24242e; color: #ddd; }
.btn.grey:hover { background: #30303c; }

.btn.danger { background: #3a1a1f; color: #ff7b7b; }
.btn.danger:hover { background: #4d2029; }

#msg {
  text-align: center;
  font-size: .87rem;
  min-height: 22px;
  margin-top: 10px;
  color: #aaa;
}

.loading { text-align: center; color: #777; padding: 80px 20px; }
</style>
</head>
<body>

<div class="header">
  <button class="back" onclick="window.location.href='/'">←</button>
  <h1>Your Account</h1>
</div>

<div class="wrap" id="wrap">
  <div class="loading">Loading your account... 👤</div>
</div>

<input type="file" id="fileIn" accept="image/*">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://gmdmpxxgqwcbyxtdwncv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZG1weHhncXdjYnl4dGR3bmN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzA3OTUsImV4cCI6MjEwMDkwNjc5NX0.aRNPYVsOD6LWsU2XlJIkTGBg_PPG6-yuGdYG4jsD5m0';

const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
const wrap = document.getElementById('wrap');
const fileIn = document.getElementById('fileIn');

const FALLBACK = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="84" height="84"><rect width="84" height="84" fill="#24242e"/><text x="42" y="55" font-size="38" text-anchor="middle">A</text></svg>'
);

const ICONS = {
  github: '<span class="link-icon ic-github"><svg width="18" height="18" viewBox="0 0 16 16" fill="#fff"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></span>',
  google: '<span class="link-icon ic-google"><svg width="17" height="17" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></span>',
  discord: '<span class="link-icon ic-discord"><svg width="19" height="15" viewBox="0 0 71 55" fill="#fff"><path d="M60.1 4.9A58.5 58.5 0 0 0 45.6.4a.2.2 0 0 0-.2.1c-.6 1.1-1.3 2.5-1.8 3.6a54 54 0 0 0-16.2 0A37 37 0 0 0 25.5.5a.2.2 0 0 0-.2-.1c-5 .9-9.9 2.4-14.5 4.5a.2.2 0 0 0-.1.1C1.6 18.7-1 32.1.3 45.4c0 .1 0 .2.1.2a58.9 58.9 0 0 0 17.8 9 .2.2 0 0 0 .2-.1c1.4-1.9 2.6-3.9 3.7-6a.2.2 0 0 0-.1-.3 38.8 38.8 0 0 1-5.5-2.6.2.2 0 0 1 0-.4l1.1-.9a.2.2 0 0 1 .2 0 42 42 0 0 0 35.6 0 .2.2 0 0 1 .2 0l1.1.9a.2.2 0 0 1 0 .4 36.4 36.4 0 0 1-5.5 2.6.2.2 0 0 0-.1.3c1.1 2.1 2.3 4.1 3.7 6a.2.2 0 0 0 .2.1 58.7 58.7 0 0 0 17.8-9 .2.2 0 0 0 .1-.2c1.5-15.3-2.6-28.6-10.8-40.4a.2.2 0 0 0-.1-.1zM23.7 37.3c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2zm23.6 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2c3.6 0 6.5 3.3 6.4 7.2 0 4-2.8 7.2-6.4 7.2z"/></svg></span>',
  email: '<span class="link-icon ic-email">@</span>'
};

const NAMES = { github: 'GitHub', google: 'Google', discord: 'Discord', email: 'Email' };

let user = null;
let identities = [];

function savedCount() {
  try { return (JSON.parse(localStorage.getItem('resonus_saved')) || []).length; }
  catch { return 0; }
}

function avatarUrl() {
  const m = user.user_metadata || {};
  return m.custom_avatar || m.avatar_url || m.picture || FALLBACK;
}

function displayName() {
  const m = user.user_metadata || {};
  return m.display_name || m.full_name || m.name || (user.email ? user.email.split('@')[0] : 'Music Lover');
}

function joinedDate() {
  return new Date(user.created_at).toLocaleDateString('en-GB', {
    day: 'numeric', month: 'long', year: 'numeric'
  });
}

function draw() {
  const linked = identities.map(i => i.provider);
  const canUnlink = identities.length > 1;

  const rows = ['github', 'google', 'discord', 'email'].map(p => {
    const on = linked.includes(p);
    let btn;
    if (on) {
      btn = (canUnlink && p !== 'email')
        ? '<button class="link-btn off" data-unlink="' + p + '">Unlink</button>'
        : '<button class="link-btn on" disabled>Linked</button>';
    } else {
      btn = (p === 'email')
        ? '<button class="link-btn on" disabled>-</button>'
        : '<button class="link-btn off" data-link="' + p + '">Link</button>';
    }
    return '<div class="link-row">' + ICONS[p] +
      '<div class="link-name">' + NAMES[p] +
      '<div class="link-state">' + (on ? 'Connected' : 'Not connected') + '</div></div>' +
      btn + '</div>';
  }).join('');

  wrap.innerHTML =
    '<div class="card"><div class="avatar-row">' +
      '<img class="avatar" id="avatarImg" src="' + avatarUrl() + '" alt="Avatar">' +
      '<div class="who">' +
        '<div class="who-name" id="nameBtn" title="Click to change display name">' +
          displayName() + ' <span class="edit-icon">✏️</span>' +
        '</div>' +
        '<div class="who-email">' + (user.email || 'No email') + '</div>' +
        '<div class="who-sub">Joined ' + joinedDate() + '</div>' +
        '<div class="avatar-hint">Tap photo to edit avatar</div>' +
      '</div></div></div>' +

    '<div class="card"><h2>LINKED ACCOUNTS</h2>' + rows + '</div>' +

    '<div class="card"><h2>YOUR LIBRARY</h2>' +
      '<div class="stat"><span>Saved tracks</span><span>' + savedCount() + '</span></div>' +
      '<div class="stat"><span>Sign-in methods</span><span>' + identities.length + '</span></div>' +
    '</div>' +

    '<div class="card"><h2>ACTIONS</h2>' +
      '<button class="btn grey" id="logoutBtn">Log out</button>' +
      '<button class="btn grey" id="clearBtn">Clear my library</button>' +
      '<button class="btn danger" id="deleteBtn">Delete account</button>' +
    '</div>' +

    '<div id="msg"></div>';

  document.getElementById('avatarImg').onclick = () => fileIn.click();
  document.getElementById('nameBtn').onclick = changeDisplayName;
  document.getElementById('logoutBtn').onclick = logout;
  document.getElementById('clearBtn').onclick = clearLibrary;
  document.getElementById('deleteBtn').onclick = deleteAccount;

  wrap.querySelectorAll('[data-link]').forEach(b => {
    b.onclick = () => linkProvider(b.dataset.link);
  });
  wrap.querySelectorAll('[data-unlink]').forEach(b => {
    b.onclick = () => unlinkProvider(b.dataset.unlink);
  });
}

function say(text) {
  const m = document.getElementById('msg');
  if (m) m.textContent = text;
}

async function changeDisplayName() {
  const currentName = user.user_metadata?.display_name || user.user_metadata?.full_name || '';
  const newName = prompt('Enter your new display name:', currentName || displayName());
  
  if (newName === null) return; // User pressed cancel
  const trimmed = newName.trim();
  if (!trimmed) return say('Display name cannot be empty');

  say('Updating display name...');

  const { data, error } = await sb.auth.updateUser({
    data: { display_name: trimmed }
  });

  if (error) {
    return say('Error: ' + error.message);
  }

  user = data.user;
  say('Display name updated!');
  draw();
}

async function linkProvider(provider) {
  say('Redirecting to ' + NAMES[provider] + '...');
  const { error } = await sb.auth.linkIdentity({
    provider,
    options: { redirectTo: window.location.origin + '/account.html' }
  });
  if (error) say('Error: ' + error.message);
}

async function unlinkProvider(provider) {
  const identity = identities.find(i => i.provider === provider);
  if (!identity) return;
  say('Unlinking...');
  const { error } = await sb.auth.unlinkIdentity(identity);
  if (error) return say('Error: ' + error.message);
  await load();
  say(NAMES[provider] + ' unlinked');
}

fileIn.onchange = async () => {
  const file = fileIn.files[0];
  if (!file || !user) return;

  if (file.size > 2 * 1024 * 1024) {
    return say('Picture too big - keep it under 2MB');
  }

  say('Uploading...');

  const ext = (file.name.split('.').pop() || 'png').toLowerCase();
  const path = user.id + '/avatar.' + ext;

  const { error: upErr } = await sb.storage
    .from('avatars')
    .upload(path, file, { upsert: true, contentType: file.type });

  if (upErr) return say('Error: ' + upErr.message);

  const { data } = sb.storage.from('avatars').getPublicUrl(path);
  const url = data.publicUrl + '?t=' + Date.now();

  const { error: metaErr } = await sb.auth.updateUser({
    data: { custom_avatar: url }
  });

  if (metaErr) return say('Error: ' + metaErr.message);

  document.getElementById('avatarImg').src = url;
  say('Avatar updated!');
  fileIn.value = '';
};

async function logout() {
  await sb.auth.signOut();
  window.location.href = '/';
}

async function clearLibrary() {
  if (!confirm('Clear all your saved tracks? This cannot be undone.')) return;
  localStorage.setItem('resonus_saved', '[]');
  await sb.from('libraries').upsert({
    user_id: user.id,
    tracks: [],
    updated_at: new Date().toISOString()
  });
  say('Library cleared');
  draw();
}

async function deleteAccount() {
  const answer = prompt('Type "DELETE" to permanently remove your account and all saved data:');
  if (answer !== 'DELETE') {
    if (answer !== null) say('Account deletion canceled');
    return;
  }

  say('Deleting account...');

  localStorage.removeItem('resonus_saved');

  const { error } = await sb.rpc('delete_user');

  if (error) {
    return say('Error: ' + error.message);
  }

  await sb.auth.signOut();
  window.location.href = '/';
}

async function load() {
  const { data: { session } } = await sb.auth.getSession();

  if (!session) {
    window.location.href = '/';
    return;
  }

  user = session.user;

  const { data: idData } = await sb.auth.getUserIdentities();
  identities = (idData && idData.identities) || [];

  draw();
}

load();
</script>

</body>
</html>
