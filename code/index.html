<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resonus - Music Player</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0d0d12;
  color: #fff;
  padding-bottom: 110px;
  min-height: 100vh;
}

.header {
  padding: 25px 20px;
  background: linear-gradient(135deg, #1db954 0%, #1a6fd4 100%);
}

.logo-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  gap: 10px;
}

.logo { font-size: 2rem; font-weight: bold; }

#authBtn {
  padding: 8px 16px;
  border: 2px solid rgba(255,255,255,.7);
  border-radius: 20px;
  background: transparent;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

#authBtn:hover { background: rgba(255,255,255,.2); }

.search-row { display: flex; gap: 10px; }

#searchInput {
  flex: 1;
  padding: 12px 16px;
  border: none;
  border-radius: 25px;
  font-size: 1rem;
  background: rgba(255,255,255,0.95);
  color: #111;
}

#searchInput:focus { outline: none; }

#searchBtn {
  padding: 12px 24px;
  border: none;
  border-radius: 25px;
  background: #111;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
}

#searchBtn:hover { background: #333; }

.tabs {
  display: flex;
  gap: 8px;
  padding: 15px 20px 0;
  flex-wrap: wrap;
}

.tab {
  padding: 10px 18px;
  background: #1a1a22;
  border: none;
  border-radius: 20px;
  color: #888;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}

.tab.active { background: #1db954; color: #fff; }

.results { padding: 20px; }

.rec-title {
  font-size: 1.1rem;
  margin: 0 0 14px 4px;
  color: #1db954;
}

.track {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .2s;
}

.track:hover { background: #1a1a22; }
.track.playing { background: #16301f; }

.track img {
  width: 55px;
  height: 55px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
  background: #222;
}

.track-info { flex: 1; min-width: 0; }

.track-title {
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-artist {
  font-size: .85rem;
  color: #999;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.save-btn {
  background: none;
  border: none;
  color: #1db954;
  font-size: 1.4rem;
  cursor: pointer;
  padding: 5px;
}

.msg { text-align: center; color: #777; padding: 50px 20px; }

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.open { display: flex; }

.modal-box {
  background: #16161d;
  border-radius: 14px;
  padding: 26px;
  width: 100%;
  max-width: 370px;
  max-height: 92vh;
  overflow-y: auto;
}

.modal-box h2 { margin-bottom: 6px; font-size: 1.4rem; }

.modal-sub { color: #888; font-size: .85rem; margin-bottom: 20px; }

.modal-box input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid #2f2f3d;
  border-radius: 8px;
  background: #0d0d12;
  color: #fff;
  font-size: 1rem;
}

.modal-box input:focus { outline: none; border-color: #1db954; }

.mbtn {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 1rem;
  cursor: pointer;
}

.mbtn.primary { background: #1db954; color: #fff; }
.mbtn.primary:hover { background: #1ed760; }

/* OFFICIAL BRAND BUTTONS */
.brand-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  font-size: .95rem;
  font-weight: 500;
  cursor: pointer;
  border: none;
}

.brand-btn svg { flex-shrink: 0; }

.btn-github {
  background: #24292f;
  color: #fff;
  font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  font-weight: 600;
}
.btn-github:hover { background: #32383f; }

.btn-google {
  background: #fff;
  color: #1f1f1f;
  font-family: 'Roboto', 'Segoe UI', arial, sans-serif;
}
.btn-google:hover { background: #f2f2f2; }

.or-line {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #666;
  font-size: .8rem;
  margin: 18px 0 6px;
}

.or-line::before,
.or-line::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #2f2f3d;
}

.switch-line {
  text-align: center;
  color: #888;
  font-size: .85rem;
  margin-top: 18px;
}

.switch-line span {
  color: #1db954;
  cursor: pointer;
  font-weight: 600;
}

.switch-line span:hover { text-decoration: underline; }

#closeModal {
  background: none;
  border: none;
  color: #666;
  font-size: .85rem;
  cursor: pointer;
  width: 100%;
  margin-top: 14px;
}

#authMsg {
  font-size: .85rem;
  margin-top: 12px;
  min-height: 20px;
  text-align: center;
}

/* PLAYER BAR */
.player {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #16161d;
  border-top: 1px solid #2a2a35;
  padding: 12px 20px;
  z-index: 100;
}

.now-playing {
  font-size: .9rem;
  margin-bottom: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #ccc;
}

.controls { display: flex; align-items: center; gap: 12px; }

.ctrl {
  background: none;
  border: none;
  color: #fff;
  font-size: 1.3rem;
  cursor: pointer;
  padding: 4px 8px;
}

.ctrl:hover { color: #1db954; }

#playBtn { font-size: 1.8rem; }

#seek { flex: 1; accent-color: #1db954; }

.time { font-size: .75rem; color: #888; min-width: 42px; }

/* YOUTUBE PLAYER */
#ytFrame {
  display: block;
  width: 100%;
  max-width: 500px;
  margin: 0 auto 20px;
  aspect-ratio: 16/9;
  border-radius: 8px;
  overflow: hidden;
}
#ytFrame:empty { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="logo-row">
    <div class="logo">🎵 Resonus</div>
    <button id="authBtn">Log in</button>
  </div>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search for a song...">
    <button id="searchBtn">Search</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-mode="jamendo">🎶 Jamendo</button>
  <button class="tab" data-mode="youtube">📺 YouTube</button>
  <button class="tab" data-mode="radio">📻 Radio</button>
  <button class="tab" data-mode="saved">💾 Saved</button>
</div>

<div class="results" id="results">
  <div class="msg">Loading... 🎵</div>
</div>

<div class="player">
  <div class="now-playing" id="nowPlaying">Nothing playing</div>
  <div class="controls">

</div>

<div class="modal" id="authModal">
  <div class="modal-box">
    <h2 id="modalTitle">Log in to Resonus</h2>
    <div class="modal-sub" id="modalSub">Sync your library across all your devices ☁️</div>

    <button class="brand-btn btn-github" id="githubBtn">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="#fff" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <span id="ghText">Sign in with GitHub</span>
    </button>

    <button class="brand-btn btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span id="ggText">Sign in with Google</span>
    </button>

    <div class="or-line">or</div>

    <input type="email" id="emailIn" placeholder="Email" autocomplete="email">
    <input type="password" id="passIn" placeholder="Password" autocomplete="current-password">
    <button class="mbtn primary" id="submitBtn">Log in</button>

    <div class="switch-line" id="switchLine">
      New here? <span id="switchBtn">Create an account</span>
    </div>

    <button id="closeModal">Cancel</button>
    <div id="authMsg"></div>
  </div>
</div>

<div id="ytFrame"></div>
<audio id="audio"></audio>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const JAMENDO_KEY = '46e604a8';
const YOUTUBE_KEY = 'AIzaSyAsn7CJ1lBCW24BwZG32TUJphlBFRqpYlI';

const SUPA_URL = 'https://gmdmpxxgqwcbyxtdwncv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZG1weHhncXdjYnl4dGR3bmN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzA3OTUsImV4cCI6MjEwMDkwNjc5NX0.aRNPYVsOD6LWsU2XlJIkTGBg_PPG6-yuGdYG4jsD5m0';

const audio = document.getElementById('audio');
const resultsEl = document.getElementById('results');
const nowPlaying = document.getElementById('nowPlaying');
const playBtn = document.getElementById('playBtn');
const seek = document.getElementById('seek');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');

let mode = 'jamendo';
let tracks = [];
let index = -1;
let ytPlayer = null;
let ytReady = false;
let isPlaying = false;

const FALLBACK_ART = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="55" height="55"><rect width="55" height="55" fill="#1db954"/></svg>');

/* ---------- YOUTUBE PLAYER ---------- */

function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('ytFrame', {
    height: '100%', width: '100%', videoId: '',
    playerVars: { autoplay: 0 },
    events: {
      onReady: () => { ytReady = true; },
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) next();
        if (e.data === YT.PlayerState.PLAYING) { isPlaying = true; playBtn.textContent = '⏸'; }
        if (e.data === YT.PlayerState.PAUSED) { isPlaying = false; playBtn.textContent = '▶️'; }
      }
    }
  });
}

/* ---------- HELPERS ---------- */

function fmt(s) {
  if (!s || !isFinite(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function daySeed() { return Math.floor(Date.now() / 86400000); }

function getSaved() {
  try { return JSON.parse(localStorage.getItem('resonus_saved')) || []; }
  catch { return []; }
}

function setSaved(list) {
  localStorage.setItem('resonus_saved', JSON.stringify(list));
  pushCloud(list);
}

/* ---------- AUTH ---------- */

const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

const authBtn = document.getElementById('authBtn');
const authModal = document.getElementById('authModal');
const authMsg = document.getElementById('authMsg');
const modalTitle = document.getElementById('modalTitle');
const modalSub = document.getElementById('modalSub');
const submitBtn = document.getElementById('submitBtn');
const switchLine = document.getElementById('switchLine');
const ghText = document.getElementById('ghText');
const ggText = document.getElementById('ggText');

let user = null;
let signupMode = false;

function setMode(isSignup) {
  signupMode = isSignup;
  authMsg.textContent = '';
  if (isSignup) {
    modalTitle.textContent = 'Create your account';
    modalSub.textContent = 'Join Resonus and take your library everywhere ☁️';
    submitBtn.textContent = 'Sign up with email';
    ghText.textContent = 'Sign up with GitHub';
    ggText.textContent = 'Sign up with Google';
    switchLine.innerHTML = 'Already have an account? <span id="switchBtn">Log in</span>';
  } else {
    modalTitle.textContent = 'Log in to Resonus';
    modalSub.textContent = 'Sync your library across all your devices ☁️';
    submitBtn.textContent = 'Log in';
    ghText.textContent = 'Sign in with GitHub';
    ggText.textContent = 'Sign in with Google';
    switchLine.innerHTML = 'New here? <span id="switchBtn">Create an account</span>';
  }
  document.getElementById('switchBtn').onclick = () => setMode(!signupMode);
}

function openModal() { authModal.classList.add('open'); setMode(false); }
function closeModal() { authModal.classList.remove('open'); }

document.getElementById('closeModal').onclick = closeModal;
authModal.onclick = e => { if (e.target === authModal) closeModal(); };
document.getElementById('switchBtn').onclick = () => setMode(!signupMode);

authBtn.onclick = async () => {
  if (user) await sb.auth.signOut();
  else openModal();
};

submitBtn.onclick = async () => {
  const email = document.getElementById('emailIn').value.trim();
  const password = document.getElementById('passIn').value;
  if (!email || !password) return authMsg.textContent = 'Fill in both boxes';

  if (signupMode) {
    if (password.length < 6) return authMsg.textContent = 'Password needs 6+ characters';
    authMsg.textContent = 'Creating account...';
    const { error } = await sb.auth.signUp({ email, password });
    authMsg.textContent = error ? '❌ ' + error.message : '✅ Account created!';
    if (!error) setTimeout(closeModal, 900);
  } else {
    authMsg.textContent = 'Logging in...';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    authMsg.textContent = error ? '❌ ' + error.message : '';
    if (!error) closeModal();
  }
};

async function oauth(provider) {
  authMsg.textContent = 'Redirecting...';
  const { error } = await sb.auth.signInWithOAuth({
    provider,
    options: { redirectTo: window.location.origin }
  });
  if (error) authMsg.textContent = '❌ ' + error.message;
}

document.getElementById('githubBtn').onclick = () => oauth('github');
document.getElementById('googleBtn').onclick = () => oauth('google');

/* ---------- CLOUD SYNC ---------- */

async function pushCloud(list) {
  if (!user) return;
  await sb.from('libraries').upsert({
    user_id: user.id,
    tracks: list,
    updated_at: new Date().toISOString()
  });
}

async function pullCloud() {
  if (!user) return;
  const { data } = await sb.from('libraries').select('tracks').eq('user_id', user.id).maybeSingle();
  const cloud = (data && data.tracks) || [];
  const local = getSaved();
  const merged = [...cloud];
  local.forEach(t => { if (!merged.some(c => c.id === t.id)) merged.push(t); });
  localStorage.setItem('resonus_saved', JSON.stringify(merged));
  await pushCloud(merged);
  if (mode === 'saved') render(merged, '💾 Your saved tracks');
}

sb.auth.onAuthStateChange((_e, session) => {
  user = session ? session.user : null;
  if (user) {
    authBtn.textContent = 'Log out';
    closeModal();
    pullCloud();
  } else {
    authBtn.textContent = 'Log in';
  }
});

/* ---------- RENDER ---------- */

function render(list, heading) {
  tracks = list;
  if (!list.length) {
    resultsEl.innerHTML = '<div class="msg">Nothing found 🤔</div>';
    return;
  }
  const head = heading ? `<h2 class="rec-title">${heading}</h2>` : '';
  resultsEl.innerHTML = head + list.map((t, i) => `
    <div class="track" data-i="${i}">
      <img src="${t.art}" alt="">
      <div class="track-info">
        <div class="track-title">${t.title}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
      <button class="save-btn" data-save="${i}">${mode === 'saved' ? '✕' : '＋'}</button>
    </div>
  `).join('');
}

resultsEl.addEventListener('click', e => {
  const saveBtn = e.target.closest('[data-save]');
  if (saveBtn) {
    const i = +saveBtn.dataset.save;
    let saved = getSaved();
    if (mode === 'saved') {
      saved.splice(i, 1);
      setSaved(saved);
      render(saved, '💾 Your saved tracks');
    } else {
      if (!saved.some(s => s.id === tracks[i].id)) {
        saved.push(tracks[i]);
        setSaved(saved);
      }
      saveBtn.textContent = '✓';
    }
    return;
  }
  const row = e.target.closest('.track');
  if (row) play(+row.dataset.i);
});

/* ---------- PLAYBACK ---------- */

function play(i) {
  if (i < 0 || i >= tracks.length) return;
  index = i;
  const t = tracks[i];
  nowPlaying.textContent = t.title + ' — ' + t.artist;

  document.querySelectorAll('.track').forEach((el, n) =>
    el.classList.toggle('playing', n === i));

  if (t.source === 'youtube') {
    audio.pause();
    if (ytReady) ytPlayer.loadVideoById(t.id);
  } else {
    if (ytReady) ytPlayer.stopVideo();
    audio.src = t.url;
    audio.play().catch(() => {});
  }
}

function next() { if (index + 1 < tracks.length) play(index + 1); }
function prev() { if (index > 0) play(index - 1); }

document.getElementById('nextBtn').onclick = next;
document.getElementById('prevBtn').onclick = prev;

playBtn.onclick = () => {
  const t = tracks[index];
  if (!t) return;
  if (t.source === 'youtube') {
    isPlaying ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
  } else {
    audio.paused ? audio.play() : audio.pause();
  }
};

audio.onplay = () => { isPlaying = true; playBtn.textContent = '⏸'; };
audio.onpause = () => { isPlaying = false; playBtn.textContent = '▶️'; };
audio.onended = next;

setInterval(() => {
  const t = tracks[index];
  if (!t) return;
  let cur = 0, dur = 0;
  if (t.source === 'youtube' && ytReady && ytPlayer.getDuration) {
    cur = ytPlayer.getCurrentTime() || 0;
    dur = ytPlayer.getDuration() || 0;
  } else {
    cur = audio.currentTime || 0;
    dur = audio.duration || 0;
  }
  curTime.textContent = fmt(cur);
  if (isFinite(dur) && dur) {
    durTime.textContent = fmt(dur);
    seek.value = (cur / dur) * 100;
    seek.disabled = false;
  } else {
    durTime.textContent = 'LIVE';
    seek.value = 100;
    seek.disabled = true;
  }
}, 500);

seek.oninput = () => {
  const t = tracks[index];
  if (!t) return;
  if (t.source === 'youtube' && ytReady) {
    const d = ytPlayer.getDuration();
    ytPlayer.seekTo(d * seek.value / 100, true);
  } else if (isFinite(audio.duration) && audio.duration) {
    audio.currentTime = audio.duration * seek.value / 100;
  }
};

/* ---------- DAILY ROTATION ---------- */

const JAMENDO_TAGS = [
  'electronic', 'rock', 'pop', 'lounge', 'jazz', 'hiphop', 'chillout',
  'ambient', 'funk', 'acoustic', 'metal', 'classical', 'reggae', 'soundtrack'
];

const RADIO_TAGS = [
  'pop', 'rock', 'jazz', 'dance', 'classical', 'hiphop', 'chillout',
  'news', 'electronic', '80s', 'country', 'reggae', 'indie', 'metal'
];

const REC_SEEDS = [
  'official music video', 'pop hits', 'rock anthems', 'lofi hip hop',
  'electronic dance', 'indie music video', 'hip hop hits', 'guitar music',
  'chill beats', 'classic rock', 'synthwave', 'jazz music', 'piano music',
  'drum and bass'
];

/* ---------- JAMENDO ---------- */

function mapJamendo(list) {
  return (list || []).map(t => ({
    id: 'j' + t.id,
    title: t.name,
    artist: t.artist_name,
    art: t.album_image || t.image || FALLBACK_ART,
    url: t.audio,
    source: 'jamendo'
  }));
}

async function searchJamendo(q) {
  const url = `https://api.jamendo.com/v3.0/tracks/?client_id=${JAMENDO_KEY}&format=json&limit=30&search=${encodeURIComponent(q)}&audioformat=mp32`;
  const r = await fetch(url);
  const d = await r.json();
  return mapJamendo(d.results);
}

async function loadPopularJamendo() {
  const tag = JAMENDO_TAGS[daySeed() % JAMENDO_TAGS.length];
  resultsEl.innerHTML = '<div class="msg">Loading today\'s picks... 🎶</div>';
  const url = `https://api.jamendo.com/v3.0/tracks/?client_id=${JAMENDO_KEY}&format=json&limit=40&order=popularity_month&fuzzytags=${tag}&audioformat=mp32`;
  const r = await fetch(url);
  const d = await r.json();
  render(mapJamendo(d.results), '🎲 Today\'s pick — ' + tag);
}

/* ---------- YOUTUBE ---------- */

async function searchYouTube(q) {
  const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&videoDuration=short&videoEmbeddable=true&maxResults=25&q=${encodeURIComponent(q)}&key=${YOUTUBE_KEY}`;
  const r = await fetch(url);
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return (d.items || []).map(v => ({
    id: v.id.videoId,
    title: v.snippet.title,
    artist: v.snippet.channelTitle,
    art: v.snippet.thumbnails.default.url,
    source: 'youtube'
  }));
}

async function loadRecommendations() {
  if (YOUTUBE_KEY.startsWith('PUT_YOUR')) return loadPopularJamendo();
  const day = daySeed();
  const seed = REC_SEEDS[day % REC_SEEDS.length];
  resultsEl.innerHTML = '<div class="msg">Loading today\'s picks... 🎲</div>';
  try {
    const list = await searchYouTube(seed);
    for (let i = list.length - 1; i > 0; i--) {
      const j = (day * 7 + i * 13) % (i + 1);
      [list[i], list[j]] = [list[j], list[i]];
    }
    render(list.slice(0, 15), '🎲 Recommended today — ' + seed);
  } catch (err) {
    resultsEl.innerHTML = '<div class="msg">Error: ' + err.message + '</div>';
  }
}

/* ---------- RADIO ---------- */

const RADIO_API = 'https://de1.api.radio-browser.info/json/stations';

function mapStations(list) {
  return (list || [])
    .filter(s => (s.url_resolved || s.url || '').startsWith('https'))
    .map(s => ({
      id: 'r' + s.stationuuid,
      title: s.name.trim(),
      artist: (s.country || 'Radio') + (s.tags ? ' • ' + s.tags.split(',')[0] : ''),
      art: s.favicon || FALLBACK_ART,
      url: s.url_resolved || s.url,
      source: 'radio'
    }));
}

async function loadTopRadio() {
  const tag = RADIO_TAGS[daySeed() % RADIO_TAGS.length];
  resultsEl.innerHTML = '<div class="msg">Tuning in... 📻</div>';
  const url = RADIO_API + '/bytag/' + tag + '?limit=150&hidebroken=true&order=clickcount&reverse=true';
  const r = await fetch(url);
  const list = mapStations(await r.json());
  if (!list.length) {
    const r2 = await fetch(RADIO_API + '/topclick/150');
    return render(mapStations(await r2.json()), '📻 Most played stations');
  }
  render(list, '🎲 Today\'s stations — ' + tag);
}

async function searchRadio(q) {
  const url = RADIO_API + '/search?limit=100&hidebroken=true&order=clickcount&reverse=true&name=' + encodeURIComponent(q);
  const r = await fetch(url);
  return mapStations(await r.json());
}

/* ---------- SEARCH ---------- */

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (mode === 'saved') return;

  if (mode === 'radio' && !q) return loadTopRadio();
  if (mode === 'youtube' && !q) return loadRecommendations();
  if (mode === 'jamendo' && !q) return loadPopularJamendo();
  if (!q) return;

  resultsEl.innerHTML = '<div class="msg">Searching... 🔎</div>';
  try {
    let list;
    if (mode === 'youtube') list = await searchYouTube(q);
    else if (mode === 'radio') list = await searchRadio(q);
    else list = await searchJamendo(q);
    render(list);
  } catch (err) {
    resultsEl.innerHTML = '<div class="msg">Error: ' + err.message + '</div>';
  }
}

document.getElementById('searchBtn').onclick = doSearch;
document.getElementById('searchInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') doSearch();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;
    if (mode === 'saved') render(getSaved(), '💾 Your saved tracks');
    else doSearch();
  };
});

/* ---------- START ---------- */

loadPopularJamendo();
</script>

</body>
</html>
